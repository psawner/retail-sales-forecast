<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Retail Demand Forecasting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/forecast.css">
</head>

<body>

    <header>
        <h1><i class="fa-solid fa-shop"></i>RetailForecast</h1>
        <nav>
            <a href="dashboard.html" class="btn-nav"><i class="fa-solid fa-chart-bar"></i></a>
        </nav>
    </header>

    <div class="mid">
        <div class="container">

            <h1>Retail Demand Forecasting</h1>

            <form id="forecastForm">

                <label>Store</label>
                <input type="number" id="store" required>

                <label>Date</label>
                <input type="date" id="date" required>

                <label>Promotion</label>
                <select id="promo">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>

                <label>State Holiday</label>
                <select id="stateHoliday">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>

                <label>School Holiday</label>
                <select id="schoolHoliday">
                    <option value="false">No</option>
                    <option value="true">Yes</option>
                </select>

                <label>Store Open</label>
                <select id="open">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>

                <button type="submit">
                    Predict
                </button>

            </form>
        </div>
        <div id="result"></div>
    </div>

    <script src="js/forecast.js"></script>

</body>

</html>
